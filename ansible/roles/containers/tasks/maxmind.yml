---
# MaxMind GeoIP — always installed, never shipped with credentials.
# Students run `update-maxmind-timesketch` with their own GeoLite2 account,
# which writes .env, starts the container, and configures Timesketch.

- name: Check if MaxMind is already installed
  ansible.builtin.stat:
    path: /opt/maxmind-geoipupdate/compose.yml
  register: maxmind_installed

- name: Clone MaxMind GeoIP updater
  ansible.builtin.git:
    repo: https://github.com/jknyght9/maxmind-geoipupdate.git
    dest: /opt/maxmind-geoipupdate
    depth: 1
  when: not maxmind_installed.stat.exists

- name: Create GeoIP data directory
  ansible.builtin.file:
    path: /opt/maxmind-geoipupdate/geoip_data
    state: directory
    mode: "0755"

- name: Install update-maxmind-timesketch helper
  ansible.builtin.copy:
    src: update-maxmind-timesketch
    dest: "{{ tools_dir }}/update-maxmind-timesketch"
    mode: "0755"

- name: Symlink update-maxmind-timesketch to user bin
  ansible.builtin.file:
    src: "{{ tools_dir }}/update-maxmind-timesketch"
    dest: "{{ user_local_bin }}/update-maxmind-timesketch"
    state: link
    owner: "{{ greymhatter_username }}"

# Intentionally NOT starting the container during build.
# MaxMind's free tier limits GeoLite2 downloads to 2000/day per license key
# — easy to exhaust across build iterations. The container is configured
# but left stopped until the deployed user runs update-maxmind-timesketch.
