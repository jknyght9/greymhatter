---
# MaxMind GeoIP — always installed, credentials optional
# Students configure their own account in /opt/maxmind-geoipupdate/.env

- name: Check if MaxMind is already installed
  ansible.builtin.stat:
    path: /opt/maxmind-geoipupdate/compose.yml
  register: maxmind_installed

- name: Clone MaxMind GeoIP updater
  ansible.builtin.git:
    repo: https://github.com/jknyght9/maxmind-geoipupdate.git
    dest: /opt/maxmind-geoipupdate
    depth: 1
  when: not maxmind_installed.stat.exists

- name: Create GeoIP data directory
  ansible.builtin.file:
    path: /opt/maxmind-geoipupdate/geoip_data
    state: directory
    mode: "0755"

- name: Configure MaxMind credentials
  ansible.builtin.copy:
    dest: /opt/maxmind-geoipupdate/.env
    content: |
      GEOIPUPDATE_ACCOUNT_ID={{ maxmind_account_id }}
      GEOIPUPDATE_LICENSE_KEY={{ maxmind_license_key }}
    mode: "0600"
  when: maxmind_account_id | length > 0

# Start geoipupdate during the build so the databases exist before the
# Timesketch task sets MAXMIND_DB_PATH, and hayabusa-timeline gets GeoIP.
# Each build spends one download per edition (3) against MaxMind's daily
# limit. restart: unless-stopped keeps it refreshing (72h) after deploy.
- name: Start MaxMind GeoIP updater
  when: maxmind_account_id | length > 0
  block:
    - name: Start geoipupdate
      ansible.builtin.shell:
        cmd: docker compose up -d
        chdir: /opt/maxmind-geoipupdate
      register: maxmind_up
      changed_when: maxmind_up.stderr is search('(Created|Started|Recreated|Pulling)')

    - name: Wait for GeoLite2 databases
      ansible.builtin.wait_for:
        path: /opt/maxmind-geoipupdate/geoip_data/GeoLite2-City.mmdb
        timeout: 300
