---
- name: Check if yara-python is installed
  ansible.builtin.command: pip3 show yara-python
  register: yara_check
  changed_when: false
  # Probe: rc=0 means installed; rc=1 means absent (expected first run).
  failed_when: false

- name: Install YARA Python
  when: yara_check.rc != 0
  block:
    - name: Install YARA build dependencies
      ansible.builtin.dnf:
        name:
          - python3-devel
          - gcc
          - automake
          - libtool
          - pkg-config
          - openssl-devel
        state: present

    - name: Install yara-python from pip
      ansible.builtin.pip:
        name: yara-python
        executable: pip3

    - name: Clean up yara-python source
      ansible.builtin.file:
        path: /tmp/yara-python
        state: absent

# Classic yara CLI. Previously arrived only as another package's dependency.
- name: Install YARA command-line tool
  ansible.builtin.dnf:
    name: yara
    state: present

# --- YARA-X (yr): successor to classic YARA, which upstream has put in
# maintenance mode. Classic yara stays alongside it for this term.
- name: Check installed YARA-X version
  ansible.builtin.command: "{{ tools_dir }}/yr --version"
  register: yara_x_check
  changed_when: false
  # Probe: rc!=0 means absent (expected first run).
  failed_when: false

- name: Install YARA-X
  when: yara_x_check.rc != 0 or yara_x_version not in yara_x_check.stdout
  block:
    - name: Download YARA-X release
      ansible.builtin.get_url:
        url: "https://github.com/VirusTotal/yara-x/releases/download/v{{ yara_x_version }}/yara-x-v{{ yara_x_version }}-{{ ansible_architecture }}-unknown-linux-gnu.tar.gz"
        dest: /tmp/yara-x.tar.gz
        checksum: "sha256:{{ yara_x_sha256[ansible_architecture] }}"
        mode: "0644"

    - name: Extract yr into tools directory
      ansible.builtin.unarchive:
        src: /tmp/yara-x.tar.gz
        dest: "{{ tools_dir }}"
        remote_src: true
        mode: "0755"

    - name: Remove YARA-X download
      ansible.builtin.file:
        path: /tmp/yara-x.tar.gz
        state: absent

# --- Rule set: Neo23x0/signature-base at a pinned commit, read-only (root-owned).
# Labs scan with the index, which works for both engines:
#   yara -w /opt/yara-rules/signature-base.yar SAMPLE
#   yr scan -w /opt/yara-rules/signature-base.yar SAMPLE
- name: Create YARA rules directory
  ansible.builtin.file:
    path: /opt/yara-rules
    state: directory
    mode: "0755"

- name: Check for pinned signature-base
  ansible.builtin.stat:
    path: "/opt/yara-rules/signature-base-{{ signature_base_commit }}/yara"
  register: signature_base_dir

- name: Install signature-base rules
  when: not signature_base_dir.stat.exists
  block:
    - name: Download signature-base at pinned commit
      ansible.builtin.get_url:
        url: "https://github.com/Neo23x0/signature-base/archive/{{ signature_base_commit }}.tar.gz"
        dest: /tmp/signature-base.tar.gz
        checksum: "sha256:{{ signature_base_sha256 }}"
        mode: "0644"

    - name: Extract signature-base
      ansible.builtin.unarchive:
        src: /tmp/signature-base.tar.gz
        dest: /opt/yara-rules
        remote_src: true

    - name: Remove signature-base download
      ansible.builtin.file:
        path: /tmp/signature-base.tar.gz
        state: absent

- name: Find signature-base rule files
  ansible.builtin.find:
    paths: "/opt/yara-rules/signature-base-{{ signature_base_commit }}/yara"
    patterns: "*.yar"
    excludes: "{{ signature_base_excluded }}"
  register: signature_base_rules

- name: Write signature-base rule index
  ansible.builtin.copy:
    dest: "/opt/yara-rules/signature-base-{{ signature_base_commit }}/greymhatter-index.yar"
    content: |
      // Generated by GreymHatter: every signature-base rule file that compiles
      // without LOKI/THOR external variables (see signature_base_excluded).
      {% for f in signature_base_rules.files | map(attribute='path') | sort %}
      include "{{ f }}"
      {% endfor %}
    mode: "0644"

- name: Link stable signature-base paths
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    force: true
  loop:
    - src: "/opt/yara-rules/signature-base-{{ signature_base_commit }}"
      dest: /opt/yara-rules/signature-base
    - src: "/opt/yara-rules/signature-base-{{ signature_base_commit }}/greymhatter-index.yar"
      dest: /opt/yara-rules/signature-base.yar

# Fails the build if a commit bump adds a rule that needs external variables.
- name: Verify rule index compiles with both engines
  ansible.builtin.command:
    cmd: "{{ item }}"
  changed_when: false
  loop:
    - yara -w /opt/yara-rules/signature-base.yar /dev/null
    - "{{ tools_dir }}/yr scan -w /opt/yara-rules/signature-base.yar /dev/null"
