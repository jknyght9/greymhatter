---
# PE / malware triage tooling for IS-4523 4.2.

# TLSH (fuzzy hashing; the recommended replacement for ssdeep), ssdeep (legacy,
# still seen in older reports), upx (packer), binwalk (embedded file carving).
# binwalk is 2.3.x (Python) on F42 and 3.x (Rust) on F44; the CLI differs.
- name: Install PE triage packages
  ansible.builtin.dnf:
    name:
      - python3-tlsh
      - ssdeep
      - upx
      - binwalk
    state: present
    install_weak_deps: false

# readpe (formerly pev): PE header dumps (readpe) and suspicious-indicator
# flagging (pescan). Not packaged for Fedora, so it is compiled in a container
# from a pinned tag (see Dockerfile.readpe). Gated on readpe itself, not fls,
# so greymhatter-update adds it to already-deployed VMs.

- name: Check if readpe is installed
  ansible.builtin.stat:
    path: /usr/local/bin/readpe
  register: readpe_check

- name: Build readpe from source in Docker
  when: not readpe_check.stat.exists
  block:
    - name: Copy Dockerfile.readpe to build location
      ansible.builtin.copy:
        src: Dockerfile.readpe
        dest: /tmp/Dockerfile.readpe
        mode: "0644"

    - name: Build readpe container
      ansible.builtin.command:
        cmd: >-
          docker build -f /tmp/Dockerfile.readpe
          --build-arg FEDORA_VERSION={{ ansible_distribution_major_version }}
          -t greymhatter-readpe /tmp
      register: readpe_build
      changed_when: readpe_build.rc == 0

    - name: Create temporary container for binary extraction
      ansible.builtin.command:
        cmd: docker create --name greymhatter-readpe-extract greymhatter-readpe
      register: readpe_create
      changed_when: readpe_create.rc == 0

    - name: Extract compiled readpe tree
      ansible.builtin.command:
        cmd: docker cp greymhatter-readpe-extract:/output/readpe/usr/local/. /usr/local/
      register: readpe_extract
      changed_when: readpe_extract.rc == 0

    - name: Update shared library cache
      ansible.builtin.command: ldconfig
      register: readpe_ldconfig
      changed_when: readpe_ldconfig.rc == 0

    - name: Remove readpe builder container
      ansible.builtin.command:
        cmd: docker rm greymhatter-readpe-extract
      register: readpe_rm
      changed_when: readpe_rm.rc == 0
      # Idempotent cleanup — container may not exist on partial rerun.
      failed_when: false

    - name: Remove readpe builder image
      ansible.builtin.command:
        cmd: docker rmi greymhatter-readpe
      register: readpe_rmi
      changed_when: readpe_rmi.rc == 0
      # Idempotent cleanup — image may not exist on partial rerun.
      failed_when: false

    - name: Clean up readpe Dockerfile
      ansible.builtin.file:
        path: /tmp/Dockerfile.readpe
        state: absent

    - name: Verify readpe tools run
      ansible.builtin.command:
        cmd: "{{ item }} --version"
      changed_when: false
      loop:
        - readpe
        - pescan

# Detect It Easy: installed for evaluation; not part of IS-4523 material.
- name: Check installed Detect It Easy version
  ansible.builtin.command: rpm -q --qf '%{VERSION}' detectiteasy
  register: die_check
  changed_when: false
  # Probe: rc=1 means not installed (expected first run).
  failed_when: false

- name: Install Detect It Easy
  when: die_check.stdout != die_version
  block:
    - name: Download Detect It Easy RPM
      ansible.builtin.get_url:
        url: "https://github.com/horsicq/DIE-engine/releases/download/{{ die_version }}/{{ die_rpm[ansible_architecture].file }}"
        dest: /tmp/detectiteasy.rpm
        checksum: "sha256:{{ die_rpm[ansible_architecture].sha256 }}"
        mode: "0644"

    - name: Install Detect It Easy RPM
      ansible.builtin.dnf:
        name: /tmp/detectiteasy.rpm
        state: present
        # Upstream RPMs are unsigned; integrity comes from the pinned checksum.
        disable_gpg_check: true

    - name: Remove Detect It Easy download
      ansible.builtin.file:
        path: /tmp/detectiteasy.rpm
        state: absent
