---
- name: Install encryption and disk tools
  ansible.builtin.dnf:
    name:
      - cryptsetup
      - dislocker
      - exfatprogs
      - foremost
      - hashcat
      # hashcat is useless without an OpenCL platform, and the Fusion base has no GPU.
      # pocl is the CPU runtime: without it hashcat exits with CL_PLATFORM_NOT_FOUND_KHR
      # before trying a single candidate. IS-4523 4.1.0 depends on this.
      - pocl
    state: present
    install_weak_deps: false

# hashcat's VeraCrypt (294xx/299xx) and LUKS modes take a hash string, not the
# raw volume header; these extractors produce it. Pinned to the RPM's version.
- name: Install hashcat extractors
  ansible.builtin.get_url:
    url: "https://raw.githubusercontent.com/hashcat/hashcat/{{ hashcat_tools_tag }}/tools/{{ item.name }}.py"
    dest: "{{ tools_dir }}/{{ item.name }}.py"
    checksum: "sha256:{{ item.sha256 }}"
    mode: "0755"
  loop:
    - name: veracrypt2hashcat
      sha256: "{{ veracrypt2hashcat_sha256 }}"
    - name: luks2hashcat
      sha256: "{{ luks2hashcat_sha256 }}"
  loop_control:
    label: "{{ item.name }}"

- name: Link hashcat extractors without the .py suffix
  ansible.builtin.file:
    src: "{{ tools_dir }}/{{ item }}.py"
    dest: "{{ tools_dir }}/{{ item }}"
    state: link
  loop:
    - veracrypt2hashcat
    - luks2hashcat

- name: Check if VeraCrypt is installed
  ansible.builtin.command:
    cmd: veracrypt --text --version
  register: veracrypt_check
  changed_when: false
  # Probe: rc=0 means installed; rc=127 means absent (expected first run).
  failed_when: false

- name: Install VeraCrypt (AMD64 — from veracrypt.fr RPM)
  ansible.builtin.dnf:
    name: https://launchpad.net/veracrypt/trunk/1.26.24/+download/veracrypt-console-1.26.24-Fedora-40-x86_64.rpm
    state: present
    disable_gpg_check: true
  when: veracrypt_check.rc != 0 and ansible_architecture == "x86_64"

- name: Install VeraCrypt (ARM64 — from COPR)
  when: veracrypt_check.rc != 0 and ansible_architecture == "aarch64"
  block:
    - name: Enable VeraCrypt COPR repo
      ansible.builtin.command:
        cmd: dnf copr enable -y architektapx/veracrypt
      register: copr_enable
      changed_when: "'Updating' in copr_enable.stdout or 'Enabling' in copr_enable.stdout"
      # dnf copr returns nonzero when the repo is already enabled — that's idempotent and fine.
      failed_when:
        - copr_enable.rc != 0
        - "'already enabled' not in (copr_enable.stdout | lower)"
        - "'already enabled' not in (copr_enable.stderr | lower)"

    - name: Install VeraCrypt from COPR
      ansible.builtin.dnf:
        name: veracrypt
        state: present
