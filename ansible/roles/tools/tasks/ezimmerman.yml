---
# Eric Zimmerman DFIR tools — .NET 10 cross-platform builds.
# Runs on both amd64 and arm64; tools are framework-dependent DLLs invoked via `dotnet`.

# --- .NET 10 runtime (installed to /opt/dotnet, arch-agnostic via dotnet-install.sh) ---
# Get-ZimmermanTools dropped .NET 9 builds; the tools target net10.0. Gate on a
# 10.x runtime, not the directory, so existing .NET 9 installs get upgraded
# (dotnet-install.sh installs side by side).
- name: Check if .NET 10 runtime is installed
  ansible.builtin.find:
    paths: /opt/dotnet/shared/Microsoft.NETCore.App
    patterns: "10.*"
    file_type: directory
  register: dotnet10_check

- name: Install .NET 10 runtime
  when: dotnet10_check.matched == 0
  block:
    - name: Download dotnet-install.sh
      ansible.builtin.get_url:
        url: https://dot.net/v1/dotnet-install.sh
        dest: /tmp/dotnet-install.sh
        mode: "0755"

    - name: Run dotnet-install.sh (runtime, channel 10.0)
      ansible.builtin.command:
        cmd: /tmp/dotnet-install.sh --runtime dotnet --channel 10.0 --install-dir /opt/dotnet
      changed_when: true

    - name: Remove dotnet installer
      ansible.builtin.file:
        path: /tmp/dotnet-install.sh
        state: absent

- name: Symlink dotnet into /usr/local/bin
  ansible.builtin.file:
    src: /opt/dotnet/dotnet
    dest: /usr/local/bin/dotnet
    state: link

- name: Set DOTNET_ROOT and PATH for all users
  ansible.builtin.copy:
    dest: /etc/profile.d/dotnet.sh
    content: |
      export DOTNET_ROOT=/opt/dotnet
      export PATH="$PATH:/opt/dotnet"
    mode: "0644"

# --- Zimmerman tools ---
- name: Create ezimmerman directory
  ansible.builtin.file:
    path: "{{ tools_dir }}/ezimmerman"
    state: directory
    mode: "0755"

- name: Detect doubled-up net9/net9 from earlier buggy install
  ansible.builtin.stat:
    path: "{{ tools_dir }}/ezimmerman/net9/net9"
  register: ezt_doubled

- name: Remove nested net9 dir from earlier buggy install
  ansible.builtin.file:
    path: "{{ tools_dir }}/ezimmerman/net9"
    state: absent
  when: ezt_doubled.stat.exists

- name: Download Get-ZimmermanTools.ps1
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/EricZimmerman/Get-ZimmermanTools/master/Get-ZimmermanTools.ps1
    dest: "{{ tools_dir }}/ezimmerman/Get-ZimmermanTools.ps1"
    mode: "0755"
    force: true

# Get-ZimmermanTools creates its own net/ subfolder under -Dest. On Linux its
# zip extractor appends a hard-coded '\', so the tools actually land in a
# directory literally named "net\". The entrypoint search covers both.
# (net9/ from older runs is no longer updated upstream and is ignored.)
- name: Fetch/update Zimmerman tools (.NET 10)
  ansible.builtin.command:
    cmd: pwsh -File {{ tools_dir }}/ezimmerman/Get-ZimmermanTools.ps1 -Dest {{ tools_dir }}/ezimmerman -NetVersion 10
    chdir: "{{ tools_dir }}/ezimmerman"
  register: ezt_run
  changed_when: "'downloaded' in ezt_run.stdout | lower or 'updated' in ezt_run.stdout | lower"

# Every .NET entrypoint has a <Tool>.runtimeconfig.json next to <Tool>.dll.
# WPF GUI runtimeconfigs (RegistryExplorer, TimelineExplorer, etc.) list BOTH
# Microsoft.NETCore.App and Microsoft.WindowsDesktop.App, so filter by the
# WindowsDesktop presence — those apps won't run on Linux either way.
# "net\" first so a fixed upstream net/ wins when both exist.
- name: Find EZ tool CLI entrypoints
  ansible.builtin.shell: |
    find "{{ tools_dir }}/ezimmerman/net\\" "{{ tools_dir }}/ezimmerman/net" -type f -name '*.runtimeconfig.json' 2>/dev/null | while read -r rc; do
      base="$(basename "$rc" .runtimeconfig.json)"
      dir="$(dirname "$rc")"
      dll="$dir/$base.dll"
      if [ -f "$dll" ] && ! grep -q 'Microsoft.WindowsDesktop.App' "$rc"; then
        echo "$dll"
      fi
    done
  args:
    executable: /bin/bash
  register: ezt_entrypoints
  changed_when: false

# An empty list here means the download layout changed again. Without this,
# the stale-wrapper step below silently deletes every wrapper.
- name: Assert Zimmerman CLI tools were found
  ansible.builtin.assert:
    that: ezt_entrypoints.stdout_lines | length > 0
    fail_msg: "No Zimmerman CLI entrypoints under {{ tools_dir }}/ezimmerman/net or net\\; has Get-ZimmermanTools changed its layout?"

- name: Compute wanted wrapper names
  ansible.builtin.set_fact:
    ezt_wanted: "{{ ezt_entrypoints.stdout_lines | map('basename') | map('regex_replace', '\\.dll$', '') | list }}"

- name: Find existing ezimmerman-owned wrappers in ~/.local/bin
  ansible.builtin.shell: |
    for f in {{ user_local_bin }}/*; do
      [ -f "$f" ] || continue
      if grep -q '/opt/tools/ezimmerman/' "$f" 2>/dev/null; then
        basename "$f"
      fi
    done
  args:
    executable: /bin/bash
  register: ezt_existing_wrappers
  changed_when: false

- name: Remove stale ezimmerman wrappers (present but no longer wanted)
  ansible.builtin.file:
    path: "{{ user_local_bin }}/{{ item }}"
    state: absent
  loop: "{{ ezt_existing_wrappers.stdout_lines | difference(ezt_wanted) }}"

- name: Write wrapper scripts into ~/.local/bin
  ansible.builtin.copy:
    dest: "{{ user_local_bin }}/{{ item | basename | regex_replace('\\.dll$', '') }}"
    content: |
      #!/bin/bash
      export DOTNET_ROOT=/opt/dotnet
      exec /opt/dotnet/dotnet "{{ item }}" "$@"
    mode: "0755"
    owner: "{{ greymhatter_username }}"
    group: "{{ greymhatter_username }}"
  loop: "{{ ezt_entrypoints.stdout_lines }}"
  when: ezt_entrypoints.stdout_lines | length > 0
