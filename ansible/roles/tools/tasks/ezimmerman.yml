---
# Eric Zimmerman DFIR tools — .NET 9 cross-platform builds.
# Runs on both amd64 and arm64; tools are framework-dependent DLLs invoked via `dotnet`.

# --- .NET 9 runtime (installed to /opt/dotnet, arch-agnostic via dotnet-install.sh) ---
- name: Check if .NET 9 runtime is installed
  ansible.builtin.stat:
    path: /opt/dotnet/shared/Microsoft.NETCore.App
  register: dotnet9_check

- name: Install .NET 9 runtime
  when: not dotnet9_check.stat.exists
  block:
    - name: Download dotnet-install.sh
      ansible.builtin.get_url:
        url: https://dot.net/v1/dotnet-install.sh
        dest: /tmp/dotnet-install.sh
        mode: "0755"

    - name: Run dotnet-install.sh (runtime, channel 9.0)
      ansible.builtin.command:
        cmd: /tmp/dotnet-install.sh --runtime dotnet --channel 9.0 --install-dir /opt/dotnet
      changed_when: true

    - name: Remove dotnet installer
      ansible.builtin.file:
        path: /tmp/dotnet-install.sh
        state: absent

- name: Symlink dotnet into /usr/local/bin
  ansible.builtin.file:
    src: /opt/dotnet/dotnet
    dest: /usr/local/bin/dotnet
    state: link

- name: Set DOTNET_ROOT and PATH for all users
  ansible.builtin.copy:
    dest: /etc/profile.d/dotnet.sh
    content: |
      export DOTNET_ROOT=/opt/dotnet
      export PATH="$PATH:/opt/dotnet"
    mode: "0644"

# --- Zimmerman tools ---
- name: Create ezimmerman directory
  ansible.builtin.file:
    path: "{{ tools_dir }}/ezimmerman"
    state: directory
    mode: "0755"

- name: Detect doubled-up net9/net9 from earlier buggy install
  ansible.builtin.stat:
    path: "{{ tools_dir }}/ezimmerman/net9/net9"
  register: ezt_doubled

- name: Remove nested net9 dir from earlier buggy install
  ansible.builtin.file:
    path: "{{ tools_dir }}/ezimmerman/net9"
    state: absent
  when: ezt_doubled.stat.exists

- name: Download Get-ZimmermanTools.ps1
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/EricZimmerman/Get-ZimmermanTools/master/Get-ZimmermanTools.ps1
    dest: "{{ tools_dir }}/ezimmerman/Get-ZimmermanTools.ps1"
    mode: "0755"
    force: true

# Get-ZimmermanTools creates its own net9/ subfolder under -Dest, so point
# -Dest at the parent to end up with .../ezimmerman/net9/.
- name: Fetch/update Zimmerman tools (net9)
  ansible.builtin.command:
    cmd: pwsh -File {{ tools_dir }}/ezimmerman/Get-ZimmermanTools.ps1 -Dest {{ tools_dir }}/ezimmerman -NetVersion 9
    chdir: "{{ tools_dir }}/ezimmerman"
  register: ezt_run
  changed_when: "'downloaded' in ezt_run.stdout | lower or 'updated' in ezt_run.stdout | lower"

# Every .NET entrypoint has a <Tool>.runtimeconfig.json next to <Tool>.dll.
# Filter to Microsoft.NETCore.App so we skip WPF GUIs (RegistryExplorer,
# TimelineExplorer, etc.) that require Microsoft.WindowsDesktop.App.
- name: Find EZ tool CLI entrypoints
  ansible.builtin.shell: |
    set -e
    find {{ tools_dir }}/ezimmerman/net9 -type f -name '*.runtimeconfig.json' | while read -r rc; do
      base="$(basename "$rc" .runtimeconfig.json)"
      dir="$(dirname "$rc")"
      dll="$dir/$base.dll"
      if [ -f "$dll" ] && grep -q '"Microsoft.NETCore.App"' "$rc"; then
        echo "$dll"
      fi
    done
  args:
    executable: /bin/bash
  register: ezt_entrypoints
  changed_when: false

- name: Compute wanted wrapper names
  ansible.builtin.set_fact:
    ezt_wanted: "{{ ezt_entrypoints.stdout_lines | map('basename') | map('regex_replace', '\\.dll$', '') | list }}"

- name: Find existing ezimmerman-owned wrappers in ~/.local/bin
  ansible.builtin.shell: |
    set -e
    for f in {{ user_local_bin }}/*; do
      [ -f "$f" ] || continue
      grep -q '/opt/tools/ezimmerman/' "$f" 2>/dev/null && basename "$f"
    done
  args:
    executable: /bin/bash
  register: ezt_existing_wrappers
  changed_when: false

- name: Remove stale ezimmerman wrappers (present but no longer wanted)
  ansible.builtin.file:
    path: "{{ user_local_bin }}/{{ item }}"
    state: absent
  loop: "{{ ezt_existing_wrappers.stdout_lines | difference(ezt_wanted) }}"

- name: Write wrapper scripts into ~/.local/bin
  ansible.builtin.copy:
    dest: "{{ user_local_bin }}/{{ item | basename | regex_replace('\\.dll$', '') }}"
    content: |
      #!/bin/bash
      export DOTNET_ROOT=/opt/dotnet
      exec /opt/dotnet/dotnet "{{ item }}" "$@"
    mode: "0755"
    owner: "{{ greymhatter_username }}"
    group: "{{ greymhatter_username }}"
  loop: "{{ ezt_entrypoints.stdout_lines }}"
  when: ezt_entrypoints.stdout_lines | length > 0
